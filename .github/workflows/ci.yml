name: Devcon Follow CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            mobile/package-lock.json
      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund
      - name: Install PWA dependencies
        run: npm ci --prefix web --no-audit --no-fund
      - name: Backend unit tests
        run: npm test
      - name: Node syntax checks
        run: npm run check
      - name: Compile production PWA
        run: npm run build:web
      - name: Install native client dependencies
        run: npm ci --prefix mobile --no-audit --no-fund
      - name: Expo packaging diagnostics
        working-directory: mobile
        run: npx --yes expo-doctor
      - name: Native TypeScript typecheck
        run: npm --prefix mobile run typecheck
      - name: Browser journey with two sandbox identities and real MongoDB
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser:google
          npm run test:browser
          node scripts/browser-journey.mjs --community
          node scripts/browser-qr-login.mjs
          npm run test:browser:reliability
          node scripts/browser-admin-places.mjs
          node scripts/browser-photography.mjs
          node scripts/browser-venue-arrival.mjs
          node scripts/browser-event-directory.mjs
          npm run test:browser:parity
          npm run test:browser:install
          npm run test:browser:private-install
      - name: Export native JavaScript bundles
        working-directory: mobile
        run: npx expo export --platform android --platform ios --source-maps
      - name: Inventory advisory implementations in exported JavaScript
        run: node scripts/native-bundle-exposure.mjs mobile/dist artifacts/install/native-bundle-exposure.json
      - name: Verify Bluetooth autolinking
        working-directory: mobile
        run: |
          npx expo-modules-autolinking resolve --platform apple
          npx expo-modules-autolinking resolve --platform android
      - name: Backend and web dependency audit
        run: |
          npm audit --audit-level=high
          npm --prefix web audit --audit-level=high
      - name: Build deployment container
        run: docker build -t devcon-follow:test .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/browser/
            artifacts/browser-community/
            artifacts/browser-reliability/
            artifacts/browser-parity/
            artifacts/install/
            artifacts/admin/
            artifacts/photography/
            artifacts/arrival/
            artifacts/event-directory/
  native-security:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --prefix mobile --no-audit --no-fund
      - name: Native release vulnerability gate
        run: npm --prefix mobile audit --audit-level=high
